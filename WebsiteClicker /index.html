<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLICK CLICK CLICK~</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #1a0a2e 0%, #3b1f6e 50%, #5c2d91 100%);
            font-family: system-ui, -apple-system, sans-serif;
            color: #e8d5ff;
            user-select: none;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Spiral-GIF Hintergrund – sehr geringe Opacity */
        .bg-spiral {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: url('spiral.gif') center center / cover no-repeat;
            opacity: 0.12;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 30% 40%, rgba(180, 100, 255, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 70% 60%, rgba(140, 80, 220, 0.07) 0%, transparent 50%);
            opacity: 0.9;
        }

        h1, .image-container, .score, .info-panel {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.2rem;
            color: #e0b0ff;
            text-shadow: 0 0 18px rgba(200, 120, 255, 0.7);
            letter-spacing: 2px;
            font-weight: 600;
        }

        .image-container {
            position: relative;
            display: block;
            width: min(420px, 92vw);
            height: min(620px, 75vh);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(140, 80, 255, 0.45);
            border: 2px solid #9b6bff;
            background: #2a1548;
            cursor: pointer;
            z-index: 1;
        }

        .image-container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        #click-area {
            position: absolute;
            left: 28%;
            top: 48%;
            width: 44%;
            height: 32%;
            cursor: pointer;
            z-index: 10;
        }

        .info-panel {
            position: fixed;
            top: 50%;
            right: 24px;
            transform: translateY(-50%);
            width: 200px;
            background: rgba(30, 15, 55, 0.9);
            border: 2px solid #9b6bff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 0 25px rgba(140, 80, 255, 0.35);
            font-size: 0.9rem;
            line-height: 1.45;
            color: #d4b8ff;
            z-index: 20;
        }

        .info-panel h2 {
            font-size: 1rem;
            color: #e0b0ff;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .info-panel ul {
            list-style: none;
            padding: 0;
        }

        .info-panel li {
            margin-bottom: 8px;
            padding-left: 12px;
            position: relative;
        }

        .info-panel li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: #c77dff;
            font-size: 0.7rem;
            top: 2px;
        }

        .info-panel .hint {
            margin-top: 12px;
            font-size: 0.8rem;
            color: #b08fd0;
            text-align: center;
            font-style: italic;
        }

        .score {
            margin-top: 1.4rem;
            font-size: 1.4rem;
            color: #d4a5ff;
            z-index: 1;
        }

        .score span {
            color: #ff9cf0;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .info-panel {
                position: static;
                transform: none;
                margin-top: 1.2rem;
                width: min(420px, 92vw);
            }
        }
    
        .back-home {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 200;
            padding: 8px 14px;
            background: rgba(40, 15, 70, 0.9);
            border: 2px solid #9b6bff;
            border-radius: 10px;
            color: #e8d5ff;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 0 16px rgba(140, 80, 255, 0.45);
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }
        .back-home:hover {
            background: #5c2d91;
            border-color: #ff9cf0;
            color: #ffe6ff;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <a class="back-home" href="../index.html">← Home</a>

    <div class="bg-spiral"></div>

    <h1>CLICK CLICK CLICK~</h1>

    <div class="image-container" id="container">
        <img id="main-image" alt="">
        <div id="click-area"></div>
    </div>

    <div class="score">Clicks: <span id="score">0</span></div>

    <div class="info-panel">
        <h2>Rewards</h2>
        <ul>
            <li>Every <strong>25 clicks</strong> something special happens</li>
            <li>Keep clicking to discover more</li>
            <li>Higher scores unlock new surprises</li>
        </ul>
        <div class="hint">What will you find at 25… 50… 75…?</div>
    </div>

    <script>
        let score = 0;
        let imageIndex = 0;
        const scoreEl = document.getElementById('score');
        const img = document.getElementById('main-image');
        const container = document.getElementById('container');
        const clickArea = document.getElementById('click-area');
        // Binaural: startet beim ersten Klick auf das Bild, loopt, bei Ende erneut per Klick
        let binauralAudio = null;

        function startBinaural() {
            if (!binauralAudio) {
                binauralAudio = new Audio('binaural.mp3');
                binauralAudio.loop = true;
                binauralAudio.volume = 0.75;
            }
            // Wenn pausiert oder zu Ende: neu starten
            if (binauralAudio.paused || binauralAudio.ended) {
                binauralAudio.volume = 0.75;
                binauralAudio.muted = false;
                binauralAudio.play().catch(() => {});
            }
        }

        // Bis zu 25 Bilder
        const imageCandidates = [];
        for (let i = 1; i <= 25; i++) {
            imageCandidates.push(`photo${i}.jpg`);
            imageCandidates.push(`photo${i}.jpeg`);
            imageCandidates.push(`photo${i}.png`);
        }
        imageCandidates.push('photo.jpg', 'photo.jpeg', 'dZFG60J.jpg', 'dZFG60J.jpeg', 'dZFG60J');

        const availableImages = [];
        let probeIndex = 0;

        function probeNextImage() {
            if (probeIndex >= imageCandidates.length) {
                if (availableImages.length > 0) {
                    img.src = availableImages[0];
                }
                return;
            }
            const testImg = new Image();
            const name = imageCandidates[probeIndex];
            probeIndex++;
            testImg.onload = () => {
                availableImages.push(name);
                probeNextImage();
            };
            testImg.onerror = () => {
                probeNextImage();
            };
            testImg.src = name;
        }
        probeNextImage();

        function cycleImage() {
            if (availableImages.length === 0) return;
            imageIndex = (imageIndex + 1) % availableImages.length;
            img.style.opacity = '0';
            setTimeout(() => {
                img.src = availableImages[imageIndex];
                img.style.opacity = '1';
            }, 180);
        }

        // ===== Normaler Click-Sound (Datei: click.mp3) =====
        function playClickSound() {
            try {
                const s = new Audio('click.mp3');
                s.volume = 1.0;
                s.play().catch(() => {});
            } catch (e) {}
        }

        // ===== Sequenz: zuerst clicker, danach reward =====
        function playSequenced(firstFile, secondFile) {
            const first = new Audio(firstFile);
            first.volume = 1.0;

            first.addEventListener('ended', () => {
                const second = new Audio(secondFile);
                second.volume = 1.0;
                second.play().catch(() => {});
            }, { once: true });

            first.play().catch(() => {
                const second = new Audio(secondFile);
                second.volume = 1.0;
                second.play().catch(() => {});
            });
        }

        const rewards = ['reward1.mp3', 'reward2.mp3', 'reward3.mp3', 'reward4.mp3'];

        function getRewardForScore(s) {
            const step = Math.floor(s / 25);
            if (step < 1) return null;
            const idx = (step - 1) % rewards.length;
            return rewards[idx];
        }

        function checkMilestone(currentScore) {
            if (currentScore % 25 === 0 && currentScore > 0) {
                const rewardFile = getRewardForScore(currentScore);
                if (rewardFile) {
                    playSequenced('clicker.mp3', rewardFile);
                }
                cycleImage();
            }
        }

        function handleClick(e) {
            e.preventDefault();
            e.stopPropagation();

            startBinaural();

            score++;
            scoreEl.textContent = score;

            playClickSound();
            checkMilestone(score);
        }

        clickArea.addEventListener('click', handleClick);
        container.addEventListener('click', handleClick);

        img.addEventListener('contextmenu', e => e.preventDefault());
        container.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
